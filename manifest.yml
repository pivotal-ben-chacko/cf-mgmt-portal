---
applications:
- name: cf-mgmt-portal
  memory: 256M
  instances: 1
  health-check-type: http
  health-check-http-endpoint: /healthz
  buildpacks:
    - go_buildpack
  env:
    GOPACKAGENAME: github.com/example/cf-mgmt-portal
    GO_INSTALL_PACKAGE_SPEC: ./cmd/portal

    # This file is git-tracked, so every secret is a CHANGE-ME placeholder.
    # Set the real values out-of-band and restage:
    #   cf set-env cf-mgmt-portal <VAR> <value> && cf restage cf-mgmt-portal
    # How to mint each one: docs/gitlab-setup.md, docs/cf-uaa-setup.md.

    # General
    PORTAL_URL: https://cf-mgmt-portal.apps.skynetsystems.io   # confirm apps domain via `cf domains`; must match OAuth redirect
    SESSION_KEY: CHANGE-ME  # >= 32 chars; generate with `openssl rand -base64 36`
    FOUNDATION: fog
    TARGET_BRANCH: development
    # Comma-separated usernames exempt from the OrgManager authz check (they
    # can open MRs for any org; MR review remains the gate). Optional.
    PORTAL_ADMIN_USERS: admin
    # Comma-separated UAA group names whose members get the same exemption
    # (e.g. cloud_controller.admin, or an LDAP-mapped platform-ops group).
    # Names must match the UAA group display name exactly. Requires scim.read
    # on the UAA_CLIENT_* service account — see docs/cf-uaa-setup.md. Optional.
    PORTAL_ADMIN_GROUPS: cloud_controller.admin

    # GitLab (config-repo writes via PAT; no longer used for login)
    GITLAB_URL: http://gitlab.skynetsystems.io:8929        # reachable from CF (DNS -> 192.168.1.160); no TLS needed
    GITLAB_TOKEN: CHANGE-ME  # PAT with `api` scope; see docs/gitlab-setup.md
    CONFIG_REPO_PROJECT: Global/ofs-lowers/fog-cf-mgmt
    PLATFORM_TEAM_GROUP: platform-cf-admins

    # CF foundation / UAA. Two separate UAA clients:
    #  - UAA_CLIENT_*: read-only client_credentials service account for the
    #    authz checks (authorities: cloud_controller.admin_read_only).
    #  - UAA_LOGIN_CLIENT_*: authorization_code client (scope: openid,
    #    autoapprove) for user sign-in; users authenticate on UAA's login page.
    # Creation commands for both: docs/cf-uaa-setup.md.
    CF_API_URL: https://api.system.skynetsystems.io
    UAA_URL: https://uaa.system.skynetsystems.io
    UAA_CLIENT_ID: cf-mgmt-portal
    UAA_CLIENT_SECRET: CHANGE-ME  # set at `uaac client add cf-mgmt-portal ...`
    UAA_LOGIN_CLIENT_ID: cf-mgmt-portal-login
    UAA_LOGIN_CLIENT_SECRET: CHANGE-ME  # set after `uaac client add cf-mgmt-portal-login ...`
