{{- define "header" -}}
<header>
  <div class="brand">
    <img src="/assets/fiserv-logo.svg" alt="Fiserv" class="logo">
    <h1>CF Management Portal</h1>
  </div>
  {{- if .User }}
  <div class="user-info">
    {{ .User }}
    {{- if .Foundation }} · <code>{{ .Foundation }}</code>{{ end -}}
    {{- " " -}}· <a href="/auth/logout">Sign out</a>
  </div>
  {{- end }}
</header>
{{- end -}}
